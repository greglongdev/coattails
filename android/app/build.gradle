plugins {
    id 'com.android.application'
}

android {
    namespace 'com.techgl.gonkacapital'
    compileSdk 35

    defaultConfig {
        applicationId 'com.techgl.gonkacapital'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
