<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Coattails</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 id="title">Latest</h1>
    <div id="updated" class="updated"></div>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabs" aria-label="Sections">
  <a href="#latest" data-tab="latest" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Latest</span>
  </a>
  <a href="#people" data-tab="people" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 20h6a5 5 0 0 0-4-4.9"/></svg>
    <span>People</span>
  </a>
  <a href="#about" data-tab="about" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    <span>About</span>
  </a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="format.js"></script>
<script src="feed.js"></script>
<script src="app.js"></script>
</body>
</html>
