<!doctype html>
<html><head><meta charset="utf-8"><title>inset sim</title>
<style>html,body{margin:0;background:#888}iframe{border:0;width:360px;height:780px;display:block}</style>
</head><body>
<iframe id="f" src="index.html#latest"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument.documentElement;
  d.style.setProperty('--inset-top', '48px');
  d.style.setProperty('--inset-bottom', '24px');
});
</script>
</body></html>
